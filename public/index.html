<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallMock - 壁纸样机生成工具</title>
    <link rel="stylesheet" href="/css/style.css?v=4">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📱</span>
                <span class="logo-text">WallMock</span>
                <span class="logo-sub">壁纸样机生成工具</span>
            </div>
        </header>

        <main class="main">
            <aside class="sidebar left">
                <div class="panel">
                    <div class="panel-title">
                        <span>壁纸图片</span>
                        <button id="btnClearImages" class="btn btn-xs btn-ghost">清空</button>
                    </div>

                    <div id="dropZone" class="drop-zone">
                        <div class="drop-icon">📤</div>
                        <div class="drop-text">拖拽图片到这里</div>
                        <div class="drop-sub">或点击选择文件</div>
                        <input type="file" id="fileInput" multiple accept="image/*" hidden>
                    </div>

                    <div id="imageList" class="image-list">
                        <div class="empty-hint">暂无图片</div>
                    </div>
                </div>
            </aside>

            <section class="preview-section">
                <div class="preview-toolbar">
                    <div class="toolbar-left">
                        <div class="template-selector">
                            <label>模板</label>
                            <select id="templateSelect"></select>
                        </div>
                        <div class="canvas-selector">
                            <label>画布</label>
                            <select id="canvasPreset"></select>
                        </div>
                    </div>
                    <div class="preview-info" id="previewInfo"></div>
                </div>
                <div class="preview-container">
                    <div id="previewPlaceholder" class="preview-placeholder">
                        <div class="placeholder-icon">🖼️</div>
                        <div class="placeholder-text">上传壁纸后查看预览</div>
                    </div>
                    <img id="previewImage" class="preview-image" style="display:none;" alt="预览">
                </div>
                <div class="bottom-actions">
                    <button id="btnReset" class="btn">重置参数</button>
                    <button id="btnGenerate" class="btn btn-primary btn-large">💾 生成图片</button>
                </div>
                <div id="generateResult" class="generate-result"></div>
            </section>

            <aside class="sidebar right">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="background">背景</button>
                    <button class="tab-btn" data-tab="wallpaper">壁纸</button>
                    <button class="tab-btn" data-tab="text">文字</button>
                    <button class="tab-btn" data-tab="output">输出</button>
                </div>

                <div class="tab-content active" id="tab-background">
                    <div class="panel">
                        <div class="panel-title">背景颜色</div>
                        <div class="bg-presets">
                            <button class="bg-preset" data-color="#F5F2EB" style="background:#F5F2EB">暖白</button>
                            <button class="bg-preset" data-color="#FFFFFF" style="background:#FFFFFF;border-color:#eee">纯白</button>
                            <button class="bg-preset" data-color="#F2F2F2" style="background:#F2F2F2">浅灰</button>
                            <button class="bg-preset" data-color="#202020" style="background:#202020;color:#fff">炭灰</button>
                            <button class="bg-preset" data-color="#111111" style="background:#111111;color:#fff">近黑</button>
                        </div>
                        <div class="form-row" style="margin-top:12px">
                            <label>自定义颜色</label>
                            <div class="color-picker-wrap">
                                <input type="color" id="bgColor" value="#F5F2EB">
                                <input type="text" id="bgColorHex" value="#F5F2EB" class="color-hex">
                            </div>
                        </div>
                        <div class="form-row">
                            <label>背景模式</label>
                            <select id="bgMode">
                                <option value="solid">纯色</option>
                                <option value="gradient" selected>微渐变</option>
                                <option value="adaptive">自适应壁纸色</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="tab-wallpaper">
                    <div class="panel">
                        <div class="panel-title">壁纸适配</div>
                        <div class="form-row">
                            <label>适配模式</label>
                            <select id="fitMode">
                                <option value="cover" selected>Cover (裁切填充)</option>
                                <option value="contain">Contain (完整包含)</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>缩放</label>
                            <input type="range" id="zoom" min="0.5" max="2" step="0.01" value="1">
                            <span class="range-val" id="zoomVal">1.00x</span>
                        </div>
                        <div class="form-row">
                            <label>水平偏移</label>
                            <input type="range" id="offsetX" min="-200" max="200" step="1" value="0">
                            <span class="range-val" id="offsetXVal">0px</span>
                        </div>
                        <div class="form-row">
                            <label>垂直偏移</label>
                            <input type="range" id="offsetY" min="-200" max="200" step="1" value="0">
                            <span class="range-val" id="offsetYVal">0px</span>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-title">锁屏显示</div>
                        <div class="form-row">
                            <label class="switch-row">
                                <input type="checkbox" id="showLockscreen" checked>
                                <span>显示时间日期</span>
                            </label>
                        </div>
                        <div class="form-row">
                            <label>时间</label>
                            <input type="text" id="lockTime" value="9:42">
                        </div>
                        <div class="form-row">
                            <label>日期</label>
                            <input type="text" id="lockDate" value="1月13日 星期一">
                        </div>
                        <div class="form-row">
                            <label class="switch-row">
                                <input type="checkbox" id="autoTextColor" checked>
                                <span>自动文字颜色</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="tab-text">
                    <div class="panel">
                        <div class="panel-title">品牌文字</div>
                        <div class="form-row">
                            <label>显示模式</label>
                            <select id="brandMode">
                                <option value="none">无</option>
                                <option value="minimal" selected>极简签名</option>
                                <option value="watermark">水印防盗</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>品牌名称</label>
                            <input type="text" id="brandName" value="" placeholder="留空则不显示">
                        </div>
                        <div class="form-row">
                            <label>副标题</label>
                            <select id="subtitlePreset">
                                <option value="">使用模板默认</option>
                                <option value="PHONE WALLPAPER">PHONE WALLPAPER</option>
                                <option value="DESKTOP WALLPAPER">DESKTOP WALLPAPER</option>
                                <option value="TABLET WALLPAPER">TABLET WALLPAPER</option>
                                <option value="ALL DEVICES WALLPAPER SET">ALL DEVICES WALLPAPER SET</option>
                                <option value="DESKTOP & PHONE WALLPAPER">DESKTOP & PHONE WALLPAPER</option>
                                <option value="WALLPAPER COLLECTION">WALLPAPER COLLECTION</option>
                            </select>
                            <input type="text" id="subtitleText" value="" placeholder="使用模板默认" style="margin-top:4px">
                        </div>
                        <div class="form-row">
                            <label>不透明度</label>
                            <input type="range" id="brandOpacity" min="0" max="100" step="5" value="45">
                            <span class="range-val" id="brandOpacityVal">45%</span>
                        </div>
                        <div class="form-row">
                            <label>品牌颜色</label>
                            <input type="color" id="brandColor" value="#333333">
                        </div>
                        <div class="form-row">
                            <label>副标题颜色</label>
                            <input type="color" id="subtitleColor" value="#888888">
                        </div>
                        <div id="watermarkRow" style="display:none">
                            <div class="form-row">
                                <label>水印文字</label>
                                <input type="text" id="watermarkText" value="SPARTINA">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="tab-output">
                    <div class="panel">
                        <div class="panel-title">输出设置</div>
                        <div class="form-row form-row-half">
                            <div>
                                <label>宽度</label>
                                <input type="number" id="outputWidth" value="2400">
                            </div>
                            <div>
                                <label>高度</label>
                                <input type="number" id="outputHeight" value="2400">
                            </div>
                        </div>
                        <div class="form-row">
                            <label>格式</label>
                            <select id="outputFormat">
                                <option value="JPEG" selected>JPG</option>
                                <option value="PNG">PNG</option>
                                <option value="WEBP">WebP</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>质量</label>
                            <input type="range" id="outputQuality" min="60" max="100" step="1" value="95">
                            <span class="range-val" id="outputQualityVal">95</span>
                        </div>
                        <div class="form-row">
                            <label>商品名</label>
                            <input type="text" id="productName" value="wallpaper">
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/js/app.js?v=4"></script>
</body>
</html>
